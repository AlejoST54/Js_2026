<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drapps.co</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2>Bienvenidos Plataforma Empleados | Drapps.co</h2>
<hr>

<div class="container mt-3">
    <h4>Sistema para administrar empleados en la empresa Drapps</h4>

    <button onclick="mostrarFormRegistro()" type="button" class="btn btn-success">Agregar Empleado (Con div oculto)</button>
    <button onclick="document.getElementById('buscarId').focus()" type="button" class="btn btn-primary">Buscar Empleado</button>
</div>

<hr>

<section id="seccionRegistrarse">
    <div class="container mt-3">
        <h4>Formulario de Registro</h4>
        <input type="hidden" id="indexEditar" value="">

        <form action="javascript:guardarEmpleado();">
            <div class="mb-3 mt-3">
                <label>CC:</label>
                <input type="text" class="form-control" id="ccId" placeholder="Número de documento">
            </div>
            <div class="mb-3 mt-3">
                <label>Nombres y Apellidos:</label>
                <input type="text" class="form-control" id="nombresApellidosId" placeholder="Nombres y apellidos">
            </div>
            <div class="mb-3 mt-3">
                <label>Dirección:</label>
                <input type="text" class="form-control" id="direccionId" placeholder="Dirección">
            </div>
            <div class="mb-3 mt-3">
                <label>Email:</label>
                <input type="email" class="form-control" id="emailId" placeholder="Email">
            </div>
            <div class="mb-3 mt-3">
                <label>Teléfono:</label>
                <input type="text" class="form-control" id="telefonoId" placeholder="Teléfono">
            </div>
            <div class="mb-3 mt-3">
                <label>Sueldo Base:</label>
                <input type="number" class="form-control" id="sueldoBaseId" placeholder="Sueldo base">
            </div>
            <div class="mb-3 mt-3">
                <label>Tipo de Empleado:</label>
                <select class="form-select" id="tipoEmpleadoId">
                    <option>Fijo</option>
                    <option>Contrato</option>
                </select>
            </div>
            <div class="mb-3 mt-3">
                <label>Tipo de Bonificación:</label>
                <select class="form-select" id="tipoBonificacionId">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Registrar</button>
        </form>
    </div>
</section>

<hr>

<div class="container mt-3">
    <div class="input-group mb-3">
        <input type="text" class="form-control" id="buscarId" placeholder="Buscar por nombre o documento" oninput="buscarEmpleado()">
        <button class="btn btn-primary" type="button" onclick="buscarEmpleado()">Buscar</button>
        <button class="btn btn-secondary" type="button" onclick="mostrarEmpleados()">Ver todos</button>
    </div>
</div>

<div class="container">
    <h5>Lista de Empleados (Table Hover Rows)</h5>
    <table class="table table-hover" id="tablaEmpleados">
        <tbody></tbody>
    </table>
    <h5 id="totalNomina"></h5>
</div>

<script src="model/Empleado.js"></script>
<script src="model/Contrato.js"></script>
<script src="controller/main.js"></script>
<script src="js/script.js"></script>
<script>
    mostrarEmpleados();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
