<div class="container mt-3">
  <h2>Formulario de inicio de Sesión</h2>
  <form action="/action_page.php">
    <div class="mb-3 mt-3">
      <label for="email">Email:</label>
      <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
    </div>
    <div class="mb-3">
      <label for="pwd">Password:</label>
      <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd">
    </div>
    <div class="form-check mb-3">
      <label class="form-check-label">
        <input class="form-check-input" type="checkbox" name="remember"> Remember me

<section id="seccionRegistrarse">
<div class="container mt-3">
  <h2>Formulario de Registro</h2>
  <!-- Campo oculto para saber si estamos creando o actualizando -->
  <input type="hidden" id="indexEditar" value="">

  <form action="javascript:guardarEmpleado();">
    <div class="mb-3 mt-3">
      <label for="usuario">Tipo de documento:</label>
        <select class="form-select" id="tipoDocumentoId">
            <option>RC</option>
            <option>TI</option>
            <option>CC</option>
            <option>CE</option>
            <option>PP</option>
            <option>PEP</option>
        </select>
        <input type="documento" class="form-control" id="documentoId" placeholder="Digite su identificación" name="documento">
    </div>
    <div class="mb-3 mt-3">
      <label for="nombres">Nombres:</label>
      <input type="text" class="form-control" id="nombreId" placeholder="Digite su nombre" name="nombre">
    </div>
    <div class="mb-3 mt-3">
      <label for="apellidos">Apellidos:</label>
      <input type="text" class="form-control" id="apellidosId" placeholder="Digite su usuario" name="email">
    </div>
     <div class="mb-3 mt-3">
      <label for="email">Email:</label>
      <input type="email" class="form-control" id="emailId" placeholder="Digite su email" name="email">
    </div>
    <div class="mb-3 mt-3">
      <label for="usuario">Usuario:</label>
      <input type="text" class="form-control" id="usuarioId" placeholder="Digite su usuario" name="usuario">
    </div>
    <div class="mb-3">
      <label for="pwd">Password:</label>
      <input type="password" class="form-control" id="pwdId" placeholder="Enter password" name="pswd">
    </div>
    <div class="form-check mb-3">
      <label class="form-check-label">
        <input class="form-check-input" type="checkbox" name="remember"> Remember me
      </label>
    </div>
    <button type="submit" class="btn btn-primary">Registrarse</button>
  </form>
</div>
</section>

<!-- Buscador de empleados -->

    <button class="btn btn-primary" type="button" onclick="buscarEmpleado()">Buscar</button>
